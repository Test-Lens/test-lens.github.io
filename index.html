<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Test Lens</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Test Lens — open-source tooling for clearer and more observable browser test automation.">

  <link rel="icon"
        type="image/png"
        sizes="64x64"
        href="/assets/images/favicon.png">

  <link rel="canonical"
        href="https://test-lens.github.io/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Test Lens">
  <meta property="og:title" content="Test Lens">
  <meta property="og:description"
        content="Open-source tooling for clearer and more observable browser test automation.">
  <meta property="og:url"
        content="https://test-lens.github.io/">
  <meta property="og:image"
        content="https://test-lens.github.io/assets/brand/test-lens-logo-horizontal.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Test Lens">
  <meta name="twitter:description"
        content="Open-source tooling for clearer and more observable browser test automation.">
  <meta name="twitter:image"
        content="https://test-lens.github.io/assets/brand/test-lens-logo-horizontal.png">

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #f4f7fb;
    }

    main {
      width: min(760px, calc(100% - 48px));
      text-align: center;
    }

    .icon {
      width: 112px;
      height: 112px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
    }

    p {
      margin: 0 auto 32px;
      max-width: 620px;
      color: #b7c0d4;
      line-height: 1.6;
      font-size: 1.1rem;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 9px;
      background: #f4f7fb;
      color: #0b1020;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="icon"
      src="/assets/brand/test-lens-icon.png"
      alt="Test Lens">

    <h1>Test Lens</h1>

    <p>
      Open-source tooling for clearer, more observable and easier-to-debug
      browser test automation.
    </p>

    <a href="/selenium-test-lens/">
      Selenium Test Lens documentation
    </a>
  </main>
</body>
</html>
